<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drava</title>
<meta name="robots" content="noindex">
<script>
  // Stripe sends buyers here after paying. Forward them into the app, keeping the
  // checkout session id so the app can verify the payment and unlock Operative.
  (function () {
    var p = new URLSearchParams(location.search);
    var sid = p.get("checkout") || p.get("session_id");
    location.replace("/" + (sid ? "?checkout=" + encodeURIComponent(sid) : ""));
  })();
</script>
<style>body{margin:0;background:#060606;color:#F0ECE6;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}a{color:#C8862A}</style>
</head>
<body><p>Taking you back to Drava… <a href="/">Tap here if nothing happens</a>.</p></body>
</html>
